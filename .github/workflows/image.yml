name: build telecrypt-synapse

on:
  push:
    branches: [main]
    tags: ["*-tc*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: synapse-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/telecrypt-io/telecrypt-synapse
  GIT_CONFIG_NOSYSTEM: "1"
  GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
  GIT_TERMINAL_PROMPT: "0"

jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      synapse_version: ${{ steps.version.outputs.SYNAPSE_VERSION }}
      s3_provider_version: ${{ steps.version.outputs.S3_PROVIDER_VERSION }}
      policy_release: ${{ steps.version.outputs.POLICY_RELEASE }}
      policy_wheel_sha256: ${{ steps.provenance.outputs.POLICY_WHEEL_SHA256 }}
      synapse_upstream_commit: ${{ steps.provenance.outputs.SYNAPSE_UPSTREAM_COMMIT }}
      synapse_fork_release: ${{ steps.provenance.outputs.SYNAPSE_FORK_RELEASE }}
      synapse_fork_commit: ${{ steps.provenance.outputs.SYNAPSE_FORK_COMMIT }}
      synapse_fork_archive_sha256: ${{ steps.provenance.outputs.SYNAPSE_FORK_ARCHIVE_SHA256 }}
      s3_provider_upstream_commit: ${{ steps.provenance.outputs.S3_PROVIDER_UPSTREAM_COMMIT }}
      s3_provider_fork_release: ${{ steps.provenance.outputs.S3_PROVIDER_FORK_RELEASE }}
      s3_provider_fork_commit: ${{ steps.provenance.outputs.S3_PROVIDER_FORK_COMMIT }}
      s3_provider_fork_archive_sha256: ${{ steps.provenance.outputs.S3_PROVIDER_FORK_ARCHIVE_SHA256 }}
      image_tag: ${{ steps.version.outputs.IMAGE_TAG }}
      publish: ${{ steps.version.outputs.publish }}
      annotated_tag_sha: ${{ steps.release.outputs.ANNOTATED_TAG_SHA }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Remove temporary checkout credentials before strict Git checks
        run: bash .github/clear_checkout_auth.sh
      - name: Assert the versions source is the workflow commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse HEAD)" = "$EXPECTED_SHA"
          bash -n .github/strict_git_fetch.sh
      - name: Validate the reviewed S3-provider dependency lock
        run: python3 .github/validate_dependencies.py s3-provider.lock
      - id: provenance
        name: Validate the exact fork provenance lock
        run: python3 .github/validate_provenance.py provenance.lock versions.env >> "$GITHUB_OUTPUT"
      - name: Run the offline staging entrypoint tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/test_entrypoint.py
      - name: Run the offline provenance-lock tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/test_provenance.py
      - name: Run the offline Controlplane release-boundary tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/test_prepare_inputs.py
      - name: Run the offline registry image verifier tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/test_verify_registry_image.py
      - name: Run the offline diagnostics tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/test_diagnostics.py
      - name: Run the offline package tag classifier tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/test_classify_registry_tag.py
      - name: Run the offline Git fetch tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/test_strict_git_fetch.py
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 .github/validate_versions.py versions.env >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/*)
              test "$EVENT_NAME" = push
              publish=true
              ;;
            refs/heads/main|refs/pull/*)
              publish=false
              ;;
            *) echo "unsupported workflow ref: $GITHUB_REF" >&2; exit 2 ;;
          esac
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
      - id: release
        name: Require the matching annotated release tag for publication
        if: steps.version.outputs.publish == 'true'
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.IMAGE_TAG }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-tc[1-9][0-9]*$ ]]
          expected_ref="refs/tags/$EXPECTED_TAG"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "publication requires a push of $expected_ref (got $GITHUB_REF)" >&2
            exit 2
          fi
          set +e
          expected_ref_type="$(bash .github/strict_git_fetch.sh local-read cat-file-type "$expected_ref")"
          expected_ref_type_status=$?
          set -e
          if [ "$expected_ref_type_status" -ne 0 ] || [ "$expected_ref_type" != "tag" ]; then
            echo "$expected_ref must be an annotated Git tag" >&2
            exit 2
          fi
          tagged_sha="$(bash .github/strict_git_fetch.sh local-read rev-parse "$expected_ref^{}")"
          annotated_tag_sha="$(bash .github/strict_git_fetch.sh local-read rev-parse "$expected_ref")"
          printf 'ANNOTATED_TAG_SHA=%s\n' "$annotated_tag_sha" >> "$GITHUB_OUTPUT"
          if [ "$tagged_sha" != "$EXPECTED_SHA" ]; then
            echo "$expected_ref does not point at the checked-out commit" >&2
            exit 2
          fi
          bash .github/strict_git_fetch.sh \
            "refs/tags/$EXPECTED_TAG:refs/remotes/origin/release-tag" \
            refs/heads/main:refs/remotes/origin/main
          test "$(bash .github/strict_git_fetch.sh local-read cat-file-type refs/remotes/origin/release-tag)" = tag
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse refs/remotes/origin/release-tag)" = "$annotated_tag_sha"
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse 'refs/remotes/origin/release-tag^{}')" = "$EXPECTED_SHA"
          if [ "$(bash .github/strict_git_fetch.sh local-read rev-parse refs/remotes/origin/main)" != "$tagged_sha" ]; then
            echo "$expected_ref does not point at the current refreshed origin/main commit" >&2
            exit 2
          fi
  test:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
      archive_size: ${{ steps.archive.outputs.size }}
    env:
      IMAGE_TAG: ${{ needs.versions.outputs.image_tag }}
      ARCHIVE_NAME: telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.tar
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Remove temporary checkout credentials before strict Git checks
        run: bash .github/clear_checkout_auth.sh
      - name: Assert the tested source is the workflow commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prepare and verify exact offline image inputs
        env:
          S3_PROVIDER_VERSION: ${{ needs.versions.outputs.s3_provider_version }}
          SYNAPSE_FORK_RELEASE: ${{ needs.versions.outputs.synapse_fork_release }}
          SYNAPSE_FORK_COMMIT: ${{ needs.versions.outputs.synapse_fork_commit }}
          SYNAPSE_FORK_ARCHIVE_SHA256: ${{ needs.versions.outputs.synapse_fork_archive_sha256 }}
          S3_PROVIDER_FORK_RELEASE: ${{ needs.versions.outputs.s3_provider_fork_release }}
          S3_PROVIDER_FORK_COMMIT: ${{ needs.versions.outputs.s3_provider_fork_commit }}
          S3_PROVIDER_FORK_ARCHIVE_SHA256: ${{ needs.versions.outputs.s3_provider_fork_archive_sha256 }}
          POLICY_RELEASE: ${{ needs.versions.outputs.policy_release }}
          POLICY_WHEEL_SHA256: ${{ needs.versions.outputs.policy_wheel_sha256 }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 12m python3 .github/prepare_inputs.py \
            --output release-inputs \
            --s3-provider-version "$S3_PROVIDER_VERSION" \
            --synapse-fork-release "$SYNAPSE_FORK_RELEASE" \
            --synapse-fork-commit "$SYNAPSE_FORK_COMMIT" \
            --synapse-fork-archive-sha256 "$SYNAPSE_FORK_ARCHIVE_SHA256" \
            --s3-provider-fork-release "$S3_PROVIDER_FORK_RELEASE" \
            --s3-provider-fork-commit "$S3_PROVIDER_FORK_COMMIT" \
            --s3-provider-fork-archive-sha256 "$S3_PROVIDER_FORK_ARCHIVE_SHA256" \
            --policy-release "$POLICY_RELEASE" \
            --policy-wheel-sha256 "$POLICY_WHEEL_SHA256"
          python3 .github/validate_dependencies.py s3-provider.lock release-inputs/wheelhouse
      - id: base
        name: Verify the current upstream Synapse tag identity
        env:
          BASE_REF: ghcr.io/element-hq/synapse:v${{ needs.versions.outputs.synapse_version }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/synapse-base-manifest.json"
          diagnostics="$RUNNER_TEMP/synapse-base-manifest.stderr"
          if ! bash .github/run_command.sh \
            "$manifest" "$diagnostics" 90 \
            docker manifest inspect --verbose "$BASE_REF"; then
            cat -- "$manifest" "$diagnostics" >&2
            echo "could not inspect the current upstream tag: $BASE_REF" >&2
            exit 1
          fi
          bash .github/check_diagnostics.sh "$diagnostics"
          if ! base_digest="$(jq -er '
            def amd64_leaf:
              .Descriptor as $d
              | select(
                  ($d.mediaType == "application/vnd.oci.image.manifest.v1+json" or
                   $d.mediaType == "application/vnd.docker.distribution.manifest.v2+json") and
                  $d.platform.os == "linux" and $d.platform.architecture == "amd64" and
                  ($d.digest | test("^sha256:[0-9a-f]{64}$"))
                )
              | .Descriptor.digest;
            if type == "array" then
              [ .[] | amd64_leaf ]
              | if length == 1 then .[0] else error("upstream tag must expose one amd64 leaf") end
            else
              amd64_leaf
            end
          ' "$manifest")"; then
            cat -- "$manifest" "$diagnostics" >&2
            echo "upstream tag manifest response failed the exact amd64 schema: $BASE_REF" >&2
            exit 1
          fi
          pull_stdout="$RUNNER_TEMP/synapse-base-pull.stdout"
          pull_stderr="$RUNNER_TEMP/synapse-base-pull.stderr"
          set +e
          bash .github/run_command.sh \
            "$pull_stdout" "$pull_stderr" 300 \
            docker pull --platform linux/amd64 "$BASE_REF@$base_digest"
          pull_status=$?
          set -e
          if [ "$pull_status" -ne 0 ]; then
            cat -- "$pull_stdout" "$pull_stderr" >&2
            echo "could not materialize the verified upstream base" >&2
            exit 1
          fi
          bash .github/check_diagnostics.sh "$pull_stderr"
          cat -- "$pull_stdout"
          printf 'digest=%s\n' "$base_digest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.3.0
        timeout-minutes: 5
      - name: Build the exact final image archive once
        id: build
        uses: docker/build-push-action@v7.3.0
        timeout-minutes: 20
        env:
          BUILDX_METADATA_PROVENANCE: max
          BUILDX_METADATA_WARNINGS: "true"
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: false
          network: none
          tags: ${{ env.IMAGE }}:${{ needs.versions.outputs.image_tag }}
          outputs: type=docker,dest=${{ runner.temp }}/telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.tar
          build-args: |
            SYNAPSE_BASE_REF=ghcr.io/element-hq/synapse:v${{ needs.versions.outputs.synapse_version }}@${{ steps.base.outputs.digest }}
            SYNAPSE_VERSION=${{ needs.versions.outputs.synapse_version }}
            SYNAPSE_BASE_DIGEST=${{ steps.base.outputs.digest }}
            SYNAPSE_FORK_RELEASE=${{ needs.versions.outputs.synapse_fork_release }}
            SYNAPSE_FORK_COMMIT=${{ needs.versions.outputs.synapse_fork_commit }}
            SYNAPSE_FORK_ARCHIVE_SHA256=${{ needs.versions.outputs.synapse_fork_archive_sha256 }}
            S3_PROVIDER_VERSION=${{ needs.versions.outputs.s3_provider_version }}
            S3_PROVIDER_FORK_RELEASE=${{ needs.versions.outputs.s3_provider_fork_release }}
            S3_PROVIDER_FORK_COMMIT=${{ needs.versions.outputs.s3_provider_fork_commit }}
            S3_PROVIDER_FORK_ARCHIVE_SHA256=${{ needs.versions.outputs.s3_provider_fork_archive_sha256 }}
            POLICY_RELEASE=${{ needs.versions.outputs.policy_release }}
            POLICY_WHEEL_SHA256=${{ needs.versions.outputs.policy_wheel_sha256 }}
          labels: |
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.source=https://github.com/TeleCrypt-io/synapse-server
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.versions.outputs.image_tag }}
            org.opencontainers.image.base.name=ghcr.io/element-hq/synapse
            org.opencontainers.image.base.version=v${{ needs.versions.outputs.synapse_version }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
            org.telecrypt.s3-provider.version=${{ needs.versions.outputs.s3_provider_version }}
            org.telecrypt.s3-provider.upstream.commit=${{ needs.versions.outputs.s3_provider_upstream_commit }}
            org.telecrypt.s3-provider.fork.release=${{ needs.versions.outputs.s3_provider_fork_release }}
            org.telecrypt.s3-provider.fork.commit=${{ needs.versions.outputs.s3_provider_fork_commit }}
            org.telecrypt.s3-provider.fork.archive.sha256=${{ needs.versions.outputs.s3_provider_fork_archive_sha256 }}
            org.telecrypt.synapse.upstream.commit=${{ needs.versions.outputs.synapse_upstream_commit }}
            org.telecrypt.synapse.fork.release=${{ needs.versions.outputs.synapse_fork_release }}
            org.telecrypt.synapse.fork.commit=${{ needs.versions.outputs.synapse_fork_commit }}
            org.telecrypt.synapse.fork.archive.sha256=${{ needs.versions.outputs.synapse_fork_archive_sha256 }}
            org.telecrypt.controlplane.release=${{ needs.versions.outputs.policy_release }}
            org.telecrypt.controlplane.wheel.sha256=${{ needs.versions.outputs.policy_wheel_sha256 }}
      - name: Prove the built image used the inspected upstream base
        env:
          BASE_REF: ghcr.io/element-hq/synapse:v${{ needs.versions.outputs.synapse_version }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          BUILD_METADATA_JSON: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          test -n "$BUILD_METADATA_JSON"
          metadata_bytes="$(printf '%s' "$BUILD_METADATA_JSON" | wc -c)"
          metadata_file="$(mktemp)"
          trap 'rm -f -- "$metadata_file"' EXIT
          umask 077
          printf '%s' "$BUILD_METADATA_JSON" > "$metadata_file"
          test "$(stat -c '%s' "$metadata_file")" -eq "$metadata_bytes"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/verify_base_provenance.py \
            "$metadata_file" "$BASE_REF" "$BASE_DIGEST"
      - name: Load and test the exact final image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.tar
        run: |
          set -euo pipefail
          docker_inspect() {
            local target="$1" format="$2" stdout_file stderr_file status
            stdout_file="$(mktemp "$RUNNER_TEMP/docker-inspect.stdout.XXXXXX")"
            stderr_file="$(mktemp "$RUNNER_TEMP/docker-inspect.stderr.XXXXXX")"
            set +e
            bash .github/run_command.sh \
              "$stdout_file" "$stderr_file" 30 \
              docker image inspect "$target" --format "$format"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              cat -- "$stdout_file" "$stderr_file" >&2
              rm -f -- "$stdout_file" "$stderr_file"
              return 1
            fi
            bash .github/check_diagnostics.sh "$stderr_file"
            cat -- "$stdout_file"
            rm -f -- "$stdout_file" "$stderr_file"
          }
          image_contract_failures=0
          check_image_value() {
            local description="$1" format="$2" expected="$3" actual
            if ! actual="$(docker_inspect "$IMAGE:$IMAGE_TAG" "$format")"; then
              printf 'image contract inspection failed (%s)\n' "$description" >&2
              image_contract_failures=$((image_contract_failures + 1))
              return
            fi
            if [[ "$actual" != "$expected" ]]; then
              printf 'image contract mismatch (%s): expected %q, got %q\n' \
                "$description" "$expected" "$actual" >&2
              image_contract_failures=$((image_contract_failures + 1))
            fi
          }
          test -s "$IMAGE_ARCHIVE"
          test "$(stat -c '%s' "$IMAGE_ARCHIVE")" -le $((1024 * 1024 * 1024))
          "$GITHUB_WORKSPACE/.github/load_image.sh" "$IMAGE_ARCHIVE"
          check_image_value source '{{index .Config.Labels "org.opencontainers.image.source"}}' "https://github.com/TeleCrypt-io/synapse-server"
          check_image_value license '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "BUSL-1.1"
          check_image_value version '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE_TAG"
          check_image_value revision '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$GITHUB_SHA"
          check_image_value base-name '{{index .Config.Labels "org.opencontainers.image.base.name"}}' "ghcr.io/element-hq/synapse"
          check_image_value base-version '{{index .Config.Labels "org.opencontainers.image.base.version"}}' "v${{ needs.versions.outputs.synapse_version }}"
          check_image_value base-digest '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' "${{ steps.base.outputs.digest }}"
          check_image_value user '{{.Config.User}}' "991:991"
          check_image_value entrypoint '{{json .Config.Entrypoint}}' '["/telecrypt-synapse-entrypoint"]'
          check_image_value s3-version '{{index .Config.Labels "org.telecrypt.s3-provider.version"}}' "${{ needs.versions.outputs.s3_provider_version }}"
          check_image_value s3-upstream '{{index .Config.Labels "org.telecrypt.s3-provider.upstream.commit"}}' "${{ needs.versions.outputs.s3_provider_upstream_commit }}"
          check_image_value s3-fork-release '{{index .Config.Labels "org.telecrypt.s3-provider.fork.release"}}' "${{ needs.versions.outputs.s3_provider_fork_release }}"
          check_image_value s3-fork-commit '{{index .Config.Labels "org.telecrypt.s3-provider.fork.commit"}}' "${{ needs.versions.outputs.s3_provider_fork_commit }}"
          check_image_value s3-fork-archive '{{index .Config.Labels "org.telecrypt.s3-provider.fork.archive.sha256"}}' "${{ needs.versions.outputs.s3_provider_fork_archive_sha256 }}"
          check_image_value synapse-upstream '{{index .Config.Labels "org.telecrypt.synapse.upstream.commit"}}' "${{ needs.versions.outputs.synapse_upstream_commit }}"
          check_image_value synapse-fork-release '{{index .Config.Labels "org.telecrypt.synapse.fork.release"}}' "${{ needs.versions.outputs.synapse_fork_release }}"
          check_image_value synapse-fork-commit '{{index .Config.Labels "org.telecrypt.synapse.fork.commit"}}' "${{ needs.versions.outputs.synapse_fork_commit }}"
          check_image_value synapse-fork-archive '{{index .Config.Labels "org.telecrypt.synapse.fork.archive.sha256"}}' "${{ needs.versions.outputs.synapse_fork_archive_sha256 }}"
          check_image_value policy-release '{{index .Config.Labels "org.telecrypt.controlplane.release"}}' "${{ needs.versions.outputs.policy_release }}"
          check_image_value policy-wheel '{{index .Config.Labels "org.telecrypt.controlplane.wheel.sha256"}}' "${{ needs.versions.outputs.policy_wheel_sha256 }}"
          ((image_contract_failures == 0))
          timeout --signal=TERM --kill-after=5s 2m docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/.github/image_smoke.py:/tmp/image_smoke.py:ro" \
            --env EXPECTED_SYNAPSE_VERSION="${{ needs.versions.outputs.synapse_version }}" \
            --env EXPECTED_S3_PROVIDER_VERSION="${{ needs.versions.outputs.s3_provider_version }}" \
            --env EXPECTED_SYNAPSE_FORK_RELEASE="${{ needs.versions.outputs.synapse_fork_release }}" \
            --env EXPECTED_SYNAPSE_FORK_COMMIT="${{ needs.versions.outputs.synapse_fork_commit }}" \
            --env EXPECTED_S3_PROVIDER_FORK_RELEASE="${{ needs.versions.outputs.s3_provider_fork_release }}" \
            --env EXPECTED_S3_PROVIDER_FORK_COMMIT="${{ needs.versions.outputs.s3_provider_fork_commit }}" \
            --env EXPECTED_POLICY_RELEASE="${{ needs.versions.outputs.policy_release }}" \
            --entrypoint python "$IMAGE:$IMAGE_TAG" /tmp/image_smoke.py
      - id: archive
        name: Create the tested image archive checksum
        if: needs.versions.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum -- "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          sha256sum --strict --check "$ARCHIVE_NAME.sha256"
          printf 'sha256=%s\n' "$(awk '{print $1}' "$ARCHIVE_NAME.sha256")" >> "$GITHUB_OUTPUT"
          printf 'size=%s\n' "$(stat -c '%s' "$ARCHIVE_NAME")" >> "$GITHUB_OUTPUT"
      - name: Upload the tested image archive and checksum
        if: needs.versions.outputs.publish == 'true'
        uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 5
        with:
          name: telecrypt-synapse-image-${{ needs.versions.outputs.image_tag }}
          path: |
            ${{ runner.temp }}/telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.tar
            ${{ runner.temp }}/telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
      - name: Remove prepared image inputs
        if: always()
        run: rm -rf -- release-inputs

  publish:
    if: needs.versions.outputs.publish == 'true'
    needs: [versions, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}
      tested_image_id: ${{ steps.registry.outputs.tested_image_id }}
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      IMAGE_TAG: ${{ needs.versions.outputs.image_tag }}
      ARCHIVE_NAME: telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.tar
      EXPECTED_ARCHIVE_SHA256: ${{ needs.test.outputs.archive_sha256 }}
      EXPECTED_ARCHIVE_SIZE: ${{ needs.test.outputs.archive_size }}
    steps:
      - name: Download the tested image archive and checksum
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "telecrypt-synapse-image-${IMAGE_TAG}" \
            --dir "$RUNNER_TEMP/telecrypt-synapse-image-artifact"
      - name: Checkout the exact workflow source for publication checks
        uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Remove temporary checkout credentials before strict Git checks
        run: bash .github/clear_checkout_auth.sh
      - name: Verify and load the exact tested image without retagging
        env:
          ARCHIVE_CHECKSUM: ${{ runner.temp }}/telecrypt-synapse-image-artifact/telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.tar.sha256
          IMAGE_ARCHIVE: ${{ runner.temp }}/telecrypt-synapse-image-artifact/telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.tar
          ARTIFACT_DIR: ${{ runner.temp }}/telecrypt-synapse-image-artifact
        run: |
          set -euo pipefail
          cd "$ARTIFACT_DIR"
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test "$(wc -l < "$ARCHIVE_CHECKSUM")" -eq 1
          test "$(awk 'NR == 1 { print $2 }' "$ARCHIVE_CHECKSUM")" = "$ARCHIVE_NAME"
          sha256sum --strict --check "$ARCHIVE_CHECKSUM"
          actual_archive_size="$(stat -c '%s' "$IMAGE_ARCHIVE")"
          test "$actual_archive_size" = "$EXPECTED_ARCHIVE_SIZE"
          test "$actual_archive_size" -le $((1024 * 1024 * 1024))
          actual_archive_sha256="$(sha256sum -- "$IMAGE_ARCHIVE" | awk '{print $1}')"
          test "$actual_archive_sha256" = "$EXPECTED_ARCHIVE_SHA256"
          "$GITHUB_WORKSPACE/.github/load_image.sh" "$IMAGE_ARCHIVE"
      - uses: docker/login-action@v4.6.0
        timeout-minutes: 5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: registry
        name: Verify or resume the exact tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.versions.outputs.image_tag }}
        run: |
          set -euo pipefail
          tested_image_id="$(docker image inspect "$IMAGE:$TAG" --format '{{.Id}}')"
          printf 'tested_image_id=%s\n' "$tested_image_id" >> "$GITHUB_OUTPUT"
          package_versions_file="$RUNNER_TEMP/registry-existing-package-versions.json"
          diagnostics_file="$RUNNER_TEMP/registry-existing-package-versions.stderr"
          set +e
          bash .github/run_command.sh \
            "$package_versions_file" "$diagnostics_file" 90 \
            gh api --hostname github.com \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --paginate --slurp \
              'orgs/TeleCrypt-io/packages/container/telecrypt-synapse/versions?per_page=100'
          package_versions_status=$?
          set -e
          if [ "$package_versions_status" -ne 0 ]; then
            cat -- "$package_versions_file" "$diagnostics_file" >&2
            echo "could not resolve the authenticated GitHub Packages tag state: $IMAGE:$TAG" >&2
            exit 1
          fi
          bash .github/check_diagnostics.sh "$diagnostics_file"
          if ! classification="$(python3 .github/classify_registry_tag.py "$package_versions_file" "$TAG")"; then
            cat -- "$package_versions_file" "$diagnostics_file" >&2
            echo "GitHub Packages tag response failed exact classification: $IMAGE:$TAG" >&2
            exit 1
          fi
          case "$classification" in
            absent)
              printf 'existing=false\n' >> "$GITHUB_OUTPUT"
              echo "immutable image is absent: $IMAGE:$TAG"
              ;;
            existing\ sha256:*)
              registry_digest="${classification#existing }"
              result="$(bash .github/verify_registry_image.sh "$IMAGE:$TAG" "$tested_image_id" "$registry_digest")"
              result_line="${result##*$'\n'}"
              registry_digest="${result_line#digest=}"
              if [[ ! "$registry_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "existing registry image did not return a sha256 digest: $IMAGE:$TAG" >&2
                exit 1
              fi
              printf 'existing=true\n' >> "$GITHUB_OUTPUT"
              printf 'digest=%s\n' "$registry_digest" >> "$GITHUB_OUTPUT"
              echo "resuming the exact already-pushed image: $IMAGE:$TAG"
              ;;
            *)
              cat -- "$package_versions_file" "$diagnostics_file" >&2
              echo "GitHub Packages returned an invalid tag classification: $IMAGE:$TAG" >&2
              exit 1
              ;;
          esac
      - name: Recheck registry tag absence immediately before push
        if: steps.registry.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.versions.outputs.image_tag }}
        run: |
          set -euo pipefail
          package_versions_file="$RUNNER_TEMP/registry-absence-package-versions.json"
          diagnostics_file="$RUNNER_TEMP/registry-absence-package-versions.stderr"
          set +e
          bash .github/run_command.sh \
            "$package_versions_file" "$diagnostics_file" 90 \
            gh api --hostname github.com \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --paginate --slurp \
              'orgs/TeleCrypt-io/packages/container/telecrypt-synapse/versions?per_page=100'
          package_versions_status=$?
          set -e
          if [ "$package_versions_status" -ne 0 ]; then
            cat -- "$package_versions_file" "$diagnostics_file" >&2
            echo "could not resolve the authenticated GitHub Packages tag state immediately before push: $IMAGE:$TAG" >&2
            exit 1
          fi
          bash .github/check_diagnostics.sh "$diagnostics_file"
          if ! classification="$(python3 .github/classify_registry_tag.py "$package_versions_file" "$TAG")"; then
            cat -- "$package_versions_file" "$diagnostics_file" >&2
            echo "GitHub Packages tag response failed exact classification immediately before push: $IMAGE:$TAG" >&2
            exit 1
          fi
          case "$classification" in
            absent)
              echo "immutable image remains absent immediately before push: $IMAGE:$TAG"
              ;;
            existing\ sha256:*)
              echo "immutable image appeared after the archive test: $IMAGE:$TAG" >&2
              exit 1
              ;;
            *)
              cat -- "$package_versions_file" "$diagnostics_file" >&2
              echo "GitHub Packages returned an invalid tag classification immediately before push: $IMAGE:$TAG" >&2
              exit 1
              ;;
          esac
      - name: Recheck the exact source tag and refreshed main immediately before image push
        if: steps.registry.outputs.existing != 'true'
        env:
          EXPECTED_TAG: ${{ needs.versions.outputs.image_tag }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_ANNOTATED_TAG_SHA: ${{ needs.versions.outputs.annotated_tag_sha }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/$EXPECTED_TAG"
          test "$(bash .github/strict_git_fetch.sh local-read cat-file-type "$expected_ref")" = tag
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse "$expected_ref")" = "$EXPECTED_ANNOTATED_TAG_SHA"
          bash .github/strict_git_fetch.sh \
            "refs/tags/$EXPECTED_TAG:refs/remotes/origin/release-tag" \
            refs/heads/main:refs/remotes/origin/main
          test "$(bash .github/strict_git_fetch.sh local-read cat-file-type refs/remotes/origin/release-tag)" = tag
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse refs/remotes/origin/release-tag)" = "$EXPECTED_ANNOTATED_TAG_SHA"
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse 'refs/remotes/origin/release-tag^{commit}')" = "$EXPECTED_SHA"
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
      - id: push
        if: steps.registry.outputs.existing != 'true'
        name: Push the exact tested image without rebuilding or retagging
        env:
          TAG: ${{ needs.versions.outputs.image_tag }}
        run: |
          set -euo pipefail
          tested_image_id="$(docker image inspect "$IMAGE:$TAG" --format '{{.Id}}')"
          push_stdout="$RUNNER_TEMP/registry-push.stdout"
          push_stderr="$RUNNER_TEMP/registry-push.stderr"
          set +e
          bash .github/run_command.sh \
            "$push_stdout" "$push_stderr" 600 \
            docker push "$IMAGE:$TAG"
          push_status=$?
          set -e
          if [ "$push_status" -ne 0 ]; then
            cat -- "$push_stdout" "$push_stderr" >&2
            echo "docker push failed (status $push_status)" >&2
            exit 1
          fi
          bash .github/check_diagnostics.sh "$push_stderr"
          cat -- "$push_stdout"
          manifest_file="$RUNNER_TEMP/registry-pushed-manifest.json"
          diagnostics_file="$RUNNER_TEMP/registry-pushed-manifest.stderr"
          set +e
          bash .github/run_command.sh \
            "$manifest_file" "$diagnostics_file" 90 \
            docker manifest inspect --verbose "$IMAGE:$TAG"
          manifest_status=$?
          set -e
          if [ "$manifest_status" -ne 0 ]; then
            cat -- "$manifest_file" "$diagnostics_file" >&2
            echo "could not inspect the pushed registry manifest" >&2
            exit 1
          fi
          bash .github/check_diagnostics.sh "$diagnostics_file"
          if ! registry_manifest_digest="$(jq -er '
            if type == "array" then
              if length == 1 then .[0].Descriptor.digest
              else error("registry tag must expose exactly one image manifest") end
            elif type == "object" then .Descriptor.digest
            else error("registry tag manifest response has an invalid shape") end
            | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
          ' "$manifest_file")"; then
            cat -- "$manifest_file" "$diagnostics_file" >&2
            echo "pushed registry manifest failed the exact schema: $IMAGE:$TAG" >&2
            exit 1
          fi
          result="$(bash .github/verify_registry_image.sh "$IMAGE:$TAG" "$tested_image_id" "$registry_manifest_digest")"
          result_line="${result##*$'\n'}"
          digest="${result_line#digest=}"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - id: digest
        name: Select the exact published image digest
        env:
          EXISTING: ${{ steps.registry.outputs.existing }}
          EXISTING_DIGEST: ${{ steps.registry.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$EXISTING" = true ]; then
            digest="$EXISTING_DIGEST"
          else
            digest="$PUSHED_DIGEST"
          fi
          case "$digest" in
            sha256:*) printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "published image digest is not a sha256 digest" >&2; exit 1 ;;
          esac
  release:
    if: needs.versions.outputs.publish == 'true'
    needs: [versions, test, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    env:
      EXPECTED_DIGEST: ${{ needs.publish.outputs.image_digest }}
      EXPECTED_IMAGE_ID: ${{ needs.publish.outputs.tested_image_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Remove temporary checkout credentials before strict Git checks
        run: bash .github/clear_checkout_auth.sh
      - name: Assert the release source is the workflow commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Revalidate the exact source tag and current main before release
        env:
          EXPECTED_TAG: ${{ needs.versions.outputs.image_tag }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_ANNOTATED_TAG_SHA: ${{ needs.versions.outputs.annotated_tag_sha }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/$EXPECTED_TAG"
          test "$(bash .github/strict_git_fetch.sh local-read cat-file-type "$expected_ref")" = tag
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse "$expected_ref")" = "$EXPECTED_ANNOTATED_TAG_SHA"
          bash .github/strict_git_fetch.sh \
            "refs/tags/$EXPECTED_TAG:refs/remotes/origin/release-tag" \
            refs/heads/main:refs/remotes/origin/main
          test "$(bash .github/strict_git_fetch.sh local-read cat-file-type refs/remotes/origin/release-tag)" = tag
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse refs/remotes/origin/release-tag)" = "$EXPECTED_ANNOTATED_TAG_SHA"
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse 'refs/remotes/origin/release-tag^{}')" = "$EXPECTED_SHA"
          test "$(bash .github/strict_git_fetch.sh local-read rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
      - uses: docker/login-action@v4.6.0
        timeout-minutes: 5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the exact single-manifest image immediately before release
        env:
          TAG: ${{ needs.versions.outputs.image_tag }}
        run: |
          set -euo pipefail
          result="$(bash .github/verify_registry_image.sh "$IMAGE:$TAG" "$EXPECTED_IMAGE_ID" "$EXPECTED_DIGEST")"
          result_line="${result##*$'\n'}"
          test "$result_line" = "digest=$EXPECTED_DIGEST"
      - name: Prepare deterministic release digest record
        env:
          RECORD_PATH: ${{ runner.temp }}/telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.digest.json
          RECORD_IMAGE: ${{ env.IMAGE }}
          RECORD_TAG: ${{ needs.versions.outputs.image_tag }}
          RECORD_DIGEST: ${{ needs.publish.outputs.image_digest }}
          RECORD_SOURCE_SHA: ${{ github.sha }}
          RECORD_ANNOTATED_TAG_SHA: ${{ needs.versions.outputs.annotated_tag_sha }}
        run: |
          set -euo pipefail
          python3 .github/release_record.py
      - name: Create and verify the exact immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_VERSION: "2026-03-10"
          RELEASE_RECORD: ${{ runner.temp }}/telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.digest.json
          RELEASE_ASSET_NAME: telecrypt-synapse-${{ needs.versions.outputs.image_tag }}.digest.json
          EXPECTED_TAG: ${{ needs.versions.outputs.image_tag }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_ANNOTATED_TAG_SHA: ${{ needs.versions.outputs.annotated_tag_sha }}
          EXPECTED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          set -euo pipefail
          bash .github/publish_release.sh
      - name: Reverify the exact registry image after immutable release publication
        env:
          TAG: ${{ needs.versions.outputs.image_tag }}
        run: |
          set -euo pipefail
          result="$(bash .github/verify_registry_image.sh "$IMAGE:$TAG" "$EXPECTED_IMAGE_ID" "$EXPECTED_DIGEST")"
          result_line="${result##*$'\n'}"
          test "$result_line" = "digest=$EXPECTED_DIGEST"
